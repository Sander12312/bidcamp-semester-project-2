<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BIDCAMP | Online Auctions</title>

    <link rel="stylesheet" href="/src/css/style.css" />
  </head>

  <body>
    <!-- Header -->

    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/" class="site-logo">BIDCAMP</a>

        <ul class="nav-links">
          <li>
            <a href="/" aria-current="page">Home</a>
          </li>

          <li>
            <a href="/explore">Explore</a>
          </li>
        </ul>

        <div class="nav-actions">
          <a href="/login" class="btn btn-outline-light"> Log in </a>

          <a href="/register" class="btn btn-cta"> Register </a>
        </div>

        <button
          class="menu-toggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
        >
          ☰
        </button>
      </nav>

      <!-- Mobile Navigation -->

      <nav
        id="mobile-menu"
        class="mobile-menu"
        aria-label="Mobile navigation"
        inert
      >
        <button type="button" class="mobile-menu-close" aria-label="Close menu">
          &times;
        </button>

        <ul>
          <li>
            <a href="/" aria-current="page">Home</a>
          </li>

          <li>
            <a href="/explore">Explore</a>
          </li>

          <li>
            <a href="/notifications">Notifications</a>
          </li>

          <li>
            <a href="/profile">Profile</a>
          </li>

          <li>
            <a href="/login">Log in</a>
          </li>

          <li>
            <a href="/register">Register</a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- Main Content -->

    <main class="page-main">
      <div class="page-container">
        <!-- Hero Section -->

        <section
          class="grid items-center gap-8 rounded-xl bg-modal p-6 text-text-light md:grid-cols-2 md:p-10"
          aria-labelledby="hero-title"
        >
          <div class="order-2 flex flex-col gap-4 md:order-1">
            <h1 id="hero-title" class="page-title">
              Buy and sell with your community
            </h1>

            <p class="body-text">
              Do a good deed and connect with the people around you.
            </p>

            <div class="mt-4 flex flex-col gap-3 md:flex-row">
              <a href="/explore" class="btn btn-outline-light w-full md:w-auto">
                Explore now
              </a>

              <a href="/register" class="btn btn-cta w-full md:w-auto">
                Create account
              </a>
            </div>
          </div>

          <img
            src="/images/BIDCAMP-logo.png"
            alt="BIDCAMP auction platform for students"
            class="order-1 w-full rounded-lg md:order-2"
          />
        </section>

        <!-- Search and Filters -->

        <section class="mt-6" role="search" aria-label="Search auctions">
          <div
            class="grid grid-cols-2 gap-3 md:grid-cols-[2fr_1fr_1fr_auto] md:items-center"
          >
            <!-- Search Input -->

            <div class="relative col-span-2 md:col-span-1">
              <label for="auction-search" class="sr-only">
                Search auctions
              </label>

              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="auction-search-icon"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="8" />

                <path d="m21 21-4.35-4.35" />
              </svg>

              <input
                type="search"
                id="auction-search"
                name="search"
                placeholder="Search for brands, items or keywords..."
                class="auction-control auction-search"
              />
            </div>

            <!-- Category -->

            <div
              id="auction-category-wrapper"
              class="order-3 col-span-2 hidden md:order-none md:col-span-1 md:block"
            >
              <label for="auction-category" class="sr-only"> Category </label>

              <select
                id="auction-category"
                name="category"
                class="auction-control"
              >
                <option value="">All categories</option>
              </select>
            </div>

            <!-- Sort -->

            <div class="order-2 md:order-none">
              <label for="auction-sort" class="sr-only"> Sort auctions </label>

              <select id="auction-sort" name="sort" class="auction-control">
                <option value="newest">Sort by: Newest</option>

                <option value="oldest">Sort by: Oldest</option>
              </select>
            </div>

            <!-- Filter Button -->

            <button
              type="button"
              id="auction-filter-button"
              class="auction-filter-button order-1 md:order-none"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="size-5"
                aria-hidden="true"
              >
                <path d="M4 4h16l-6 7v7l-4 2v-9L4 4Z" />
              </svg>

              <span>Filter</span>
            </button>
          </div>
        </section>

        <!-- Auctions -->

        <section class="mt-8" aria-labelledby="auctions-title">
          <h2 id="auctions-title" class="section-title">Auctions</h2>

          <p id="auctions-status" role="status" aria-live="polite">
            Loading auctions...
          </p>

          <div
            id="auctions-grid"
            class="mt-4 grid grid-cols-2 gap-4 md:grid-cols-4 md:gap-8"
          ></div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
